name: Temporary CDC Demo Content Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-demo-content-audit.yml'

permissions:
  contents: read

jobs:
  public-demo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium
      - name: Verify live demo content
        env:
          SITE_URL: https://owusuduahephraim1.github.io/child-development-centre/
        run: |
          cat > demo-content-audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          const assert=(c,m)=>{if(!c)throw new Error(m)};
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const errors=[];
          page.on('pageerror',e=>errors.push('pageerror: '+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
          const response=await page.goto(process.env.SITE_URL,{waitUntil:'networkidle',timeout:60000});
          assert(response?.ok(),'Public site failed to load');

          await page.waitForFunction(()=>document.querySelector('#programFeed')?.textContent?.includes('(Demo)'),null,{timeout:30000});
          assert((await page.locator('#impactStats').innerText()).includes('(Demo)'),'Demo impact statistics did not render');
          assert((await page.locator('#programFeed').innerText()).includes('Community Learning Support (Demo)'),'Demo programs did not render');

          await page.locator('[data-feed="projects"]').click();
          await page.waitForFunction(()=>document.querySelector('#programFeed')?.textContent?.includes('Community Reading Clubs (Demo)'));
          await page.locator('[data-feed="campaigns"]').click();
          await page.waitForFunction(()=>document.querySelector('#programFeed')?.textContent?.includes('Back-to-School Support Campaign (Demo)'));

          assert((await page.locator('#newsGrid').innerText()).includes('(Demo)'),'Demo news did not render');
          assert((await page.locator('#eventsGrid').innerText()).includes('(Demo)'),'Demo events did not render');
          assert(await page.locator('#leadershipSection').isVisible(),'Leadership section is hidden');
          assert((await page.locator('#leadershipGrid').innerText()).includes('Demo Executive Director'),'Demo leadership did not render');
          assert(await page.locator('#supporters').isVisible(),'Partners/supporters section is hidden');
          assert((await page.locator('#partnerLogoGrid').innerText()).includes('Demo Education Partner'),'Demo partners did not render');
          assert((await page.locator('#supporterGrid').innerText()).includes('Demo Supporter'),'Demo supporter recognition did not render');

          const resources=page.locator('#resourceList a');
          assert(await resources.count()>=3,'Demo resources did not render');
          const hrefs=await resources.evaluateAll(nodes=>nodes.map(n=>n.href));
          for(const href of hrefs.filter(x=>x.includes('/assets/resources/demo-'))){
            const r=await page.request.get(href);
            assert(r.ok(),`Demo resource failed: ${href} -> ${r.status()}`);
            const body=await r.text();
            assert(body.includes('DEMONSTRATION DOCUMENT'),'Demo resource disclaimer missing: '+href);
          }

          assert(!errors.length,'Browser errors:\n'+errors.join('\n'));
          console.log('CDC public demo content audit passed.');
          await browser.close();
          EOF
          node demo-content-audit.mjs
