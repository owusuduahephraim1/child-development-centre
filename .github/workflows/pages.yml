name: Deploy Child Development Centre to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate JavaScript
        run: |
          set -euo pipefail
          node --check assets/runtime-config.js
          node --check assets/public-runtime.v3.0.0.js
          node --check worker/src/index.js
          node --input-type=module --check < assets/app.v3.0.0-neon-r2.js

      - name: Build static Pages artifact
        env:
          CDC_CANONICAL_URL: ${{ vars.CDC_CANONICAL_URL }}
          CDC_NEON_AUTH_URL: ${{ vars.CDC_NEON_AUTH_URL }}
          CDC_NEON_DATA_API_URL: ${{ vars.CDC_NEON_DATA_API_URL }}
          CDC_MEDIA_WORKER_URL: ${{ vars.CDC_MEDIA_WORKER_URL }}
          CDC_ORGANISATION_LOGO_URL: ${{ vars.CDC_ORGANISATION_LOGO_URL }}
          CDC_SCHOOL_LOGO_URL: ${{ vars.CDC_SCHOOL_LOGO_URL }}
        run: node scripts/build-pages.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
