name: Deploy Child Development Centre to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Validate JavaScript
        run: |
          set -euo pipefail
          node --check assets/runtime-config.js
          node --check assets/public-runtime.v3.0.0.js
          node --check worker/src/index.js
          node --input-type=module --check < assets/app.v3.0.0-neon-r2.js

      - name: Build static Pages artifact
        env:
          CDC_CANONICAL_URL: https://owusuduahephraim1.github.io/child-development-centre/
          CDC_NEON_AUTH_URL: https://ep-calm-dawn-b4t6enjm.neonauth.c-6.us-east-2.aws.neon.tech/neondb/auth
          CDC_NEON_DATA_API_URL: https://ep-calm-dawn-b4t6enjm.apirest.c-6.us-east-2.aws.neon.tech/neondb/rest/v1
          CDC_MEDIA_WORKER_URL: https://cdc-media.edusentia-enterprise-neon.workers.dev
          CDC_SEO_SHARE_IMAGE_URL: https://cdc-media.edusentia-enterprise-neon.workers.dev/media/images/settings/seo_share_image/2026/08/b3da4073-2e0e-437e-ae39-f3d35bbdfd40.webp
          CDC_ORGANISATION_LOGO_URL: ""
          CDC_SCHOOL_LOGO_URL: ""
        run: node scripts/build-pages.mjs

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify live CDC site and media service
        shell: bash
        run: |
          set -euo pipefail
          SITE_URL="https://owusuduahephraim1.github.io/child-development-centre/"
          RUNTIME_URL="${SITE_URL}assets/runtime-config.js"
          ADMIN_URL="${SITE_URL}admin/"
          ADMIN_JS_URL="${SITE_URL}assets/admin-login.v1.0.0.js"
          WORKER_URL="https://cdc-media.edusentia-enterprise-neon.workers.dev"

          for attempt in 1 2 3 4 5; do
            if page="$(curl --fail --silent --show-error --location "$SITE_URL")" \
              && admin="$(curl --fail --silent --show-error --location "$ADMIN_URL")" \
              && admin_js="$(curl --fail --silent --show-error --location "$ADMIN_JS_URL")" \
              && runtime="$(curl --fail --silent --show-error --location "$RUNTIME_URL")" \
              && health="$(curl --fail --silent --show-error --location "$WORKER_URL/health")"; then
              printf '%s' "$page" | grep -F "Child Development Centre" >/dev/null
              if printf '%s' "$page" | grep -F 'id="adminOpen"' >/dev/null; then
                echo "Public administrator entry control is still visible."
                exit 1
              fi
              printf '%s' "$page" | grep -F '<link id="canonicalUrl" rel="canonical" href="https://owusuduahephraim1.github.io/child-development-centre/">' >/dev/null
              printf '%s' "$page" | grep -F '<meta id="ogUrl" property="og:url" content="https://owusuduahephraim1.github.io/child-development-centre/">' >/dev/null
              printf '%s' "$page" | grep -F '<meta id="ogImage" property="og:image" content="https://cdc-media.edusentia-enterprise-neon.workers.dev/media/images/settings/seo_share_image/2026/08/b3da4073-2e0e-437e-ae39-f3d35bbdfd40.webp">' >/dev/null
              printf '%s' "$page" | grep -F '<meta id="twitterImage" name="twitter:image" content="https://cdc-media.edusentia-enterprise-neon.workers.dev/media/images/settings/seo_share_image/2026/08/b3da4073-2e0e-437e-ae39-f3d35bbdfd40.webp">' >/dev/null
              printf '%s' "$admin" | grep -F 'Secure Administration Portal' >/dev/null
              printf '%s' "$admin" | grep -F 'Administrator Sign In' >/dev/null
              printf '%s' "$admin" | grep -F 'name="robots" content="noindex,nofollow,noarchive"' >/dev/null
              printf '%s' "$admin_js" | grep -F "from('admin_users')" >/dev/null
              printf '%s' "$admin_js" | grep -F "resetPasswordForEmail" >/dev/null
              printf '%s' "$runtime" | grep -F "$WORKER_URL" >/dev/null
              printf '%s' "$runtime" | grep -F "ep-calm-dawn-b4t6enjm.neonauth.c-6.us-east-2.aws.neon.tech" >/dev/null
              printf '%s' "$runtime" | grep -F "ep-calm-dawn-b4t6enjm.apirest.c-6.us-east-2.aws.neon.tech" >/dev/null
              printf '%s' "$health" | grep -F '"ok":true' >/dev/null
              echo "Live CDC site, Neon runtime, and media Worker verified."
              exit 0
            fi
            sleep 5
          done

          echo "Live CDC smoke test failed."
          exit 1
