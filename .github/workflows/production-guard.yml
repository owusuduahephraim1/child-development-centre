name: CDC v3 Guard

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.html
            assets/styles.v2.0.0.css
            assets/runtime-config.js
            assets/runtime-config.example.js
            assets/app.v3.0.0-neon-r2.js
            assets/public-runtime.v3.0.0.js
            assets/password-recovery.v2.3.1.js
            assets/admin-login.v1.0.0.js
            assets/admin-login.v1.0.0.css
            admin/index.html
            scripts/build-pages.mjs
            worker/src/index.js
            worker/wrangler.toml.example
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/runtime-config.js
          node --check assets/public-runtime.v3.0.0.js
          node --check assets/password-recovery.v2.3.1.js
          node --check assets/admin-login.v1.0.0.js
          node --check worker/src/index.js
          node --input-type=module --check < assets/app.v3.0.0-neon-r2.js
          node --check scripts/build-pages.mjs

      - name: Validate CDC project isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html').read_text(encoding='utf-8')
          runtime = Path('assets/runtime-config.js').read_text(encoding='utf-8')
          app = Path('assets/app.v3.0.0-neon-r2.js').read_text(encoding='utf-8')
          admin = Path('admin/index.html').read_text(encoding='utf-8')
          admin_js = Path('assets/admin-login.v1.0.0.js').read_text(encoding='utf-8')
          active = '\n'.join([index, runtime, app, admin, admin_js])

          expected = [
              'window.CDC_CONFIG',
              'ep-calm-dawn-b4t6enjm.neonauth.c-6.us-east-2.aws.neon.tech',
              'ep-calm-dawn-b4t6enjm.apirest.c-6.us-east-2.aws.neon.tech',
              'owusuduahephraim1.github.io/child-development-centre/',
              'seo_share_image',
              'property="og:image"',
              'name="twitter:image"',
              'Secure Administration Portal',
              'Administrator Sign In',
              "from('admin_users')",
              'resetPasswordForEmail',
              "new URL('admin/'",
          ]
          for value in expected:
              if value not in active:
                  raise SystemExit(f'Missing dedicated CDC runtime value: {value}')

          forbidden = [
              'window.NIS_CONFIG',
              'auth.signUp',
              'adminSignupForm',
              'showFirstAdminSetup',
              'ep-quiet-star-af3t7s87',
              'nduah385.github.io/nis-childdevelopment',
              'calm-grass-25059501',
              'Edusentia-Enterprise-Neon-Edition',
          ]
          for value in forbidden:
              if value in active:
                  raise SystemExit(f'Foreign or legacy project endpoint leaked into CDC runtime: {value}')

          runtime_pos = index.find('assets/runtime-config.js')
          app_pos = index.find('assets/app.v3.0.0-neon-r2.js')
          if 'name="robots" content="noindex,nofollow,noarchive"' not in admin:
              raise SystemExit('Dedicated admin page must remain excluded from search indexing.')
          if '../assets/runtime-config.js' not in admin or '../assets/admin-login.v1.0.0.js' not in admin:
              raise SystemExit('Dedicated admin page is missing required runtime assets.')
          if "eq('id', session.user.id)" not in admin_js or "is_active" not in admin_js:
              raise SystemExit('Dedicated admin login must verify the active administrator record.')
          if runtime_pos < 0 or app_pos < 0 or runtime_pos > app_pos:
              raise SystemExit('CDC runtime configuration must load before the application module.')

          import re
          ids = set(re.findall(r'id=["\\\']([^"\\\']+)["\\\']', index))
          internal_targets = re.findall(r'href=["\\\']#([^"\\\']+)["\\\']', index)
          missing_targets = sorted({target for target in internal_targets if target and target not in ids})
          if missing_targets:
              raise SystemExit('Broken internal navigation targets: ' + ', '.join(missing_targets))

          print('CDC v3 runtime is isolated from old CDC and Edusentia resources.')
          PY

      - name: Reject obvious secret material
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          patterns = [
              re.compile(r'(?i)postgres(?:ql)?://[^\s]+:[^\s]+@'),
              re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              re.compile(r'(?i)\b(service_role|R2_GATEWAY_ADMIN_SECRET|R2_GATEWAY_SIGNING_SECRET)\b\s*[:=]\s*["\'][^"\']+["\']'),
          ]
          hits = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() not in {'.html','.js','.css','.json','.md','.sql','.toml','.txt','.xml','.yml','.yaml'}:
                  continue
              value = path.read_text(encoding='utf-8', errors='ignore')
              if any(pattern.search(value) for pattern in patterns):
                  hits.append(str(path))
          if hits:
              raise SystemExit('Potential secret material found in: ' + ', '.join(hits))
          print('No obvious committed secret material detected.')
          PY
