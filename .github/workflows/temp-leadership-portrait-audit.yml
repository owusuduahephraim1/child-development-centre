name: Temporary CDC Leadership Portrait Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-leadership-portrait-audit.yml'

permissions:
  contents: read

jobs:
  leadership-portrait-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium
      - name: Verify live leadership portraits
        env:
          SITE_URL: https://owusuduahephraim1.github.io/child-development-centre/
        run: |
          cat > audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          let ok=false;
          for(let attempt=0;attempt<12;attempt++){
            await page.goto(process.env.SITE_URL,{waitUntil:'networkidle',timeout:60000});
            try{
              await page.waitForFunction(()=>{
                const cards=[...document.querySelectorAll('#leadershipGrid .leader-card')];
                if(cards.length<3)return false;
                const imgs=cards.map(c=>c.querySelector('img')).filter(Boolean);
                return imgs.length>=3 && imgs.every(i=>i.complete&&i.naturalWidth>0&&i.src.includes('/assets/leadership/demo-'));
              },null,{timeout:5000});
              ok=true; break;
            }catch{ await new Promise(r=>setTimeout(r,5000)); }
          }
          if(!ok)throw new Error('Leadership placeholder portraits did not render on live site');
          const text=await page.locator('#leadershipGrid').innerText();
          for(const name of ['Demo Executive Director','Demo Programmes Lead','Demo Community Engagement Lead']){
            if(!text.includes(name))throw new Error('Missing live leadership card: '+name);
          }
          const desktopOverflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
          if(desktopOverflow>2)throw new Error('Desktop horizontal overflow: '+desktopOverflow);
          await page.setViewportSize({width:390,height:844});
          await page.reload({waitUntil:'networkidle'});
          const mobileOverflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
          if(mobileOverflow>2)throw new Error('Mobile horizontal overflow: '+mobileOverflow);
          if(errors.length)throw new Error('Browser errors: '+errors.join(' | '));
          console.log('CDC leadership portrait audit passed.');
          await browser.close();
          EOF
          node audit.mjs
