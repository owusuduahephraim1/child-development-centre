name: Temporary CDC R2 Lifecycle Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-r2-lifecycle-audit.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: cdc-media-production
      WORKER: https://cdc-media.edusentia-enterprise-neon.workers.dev
      KEY: images/audit/r2-lifecycle-${{ github.run_id }}.png

    steps:
      - uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Verify R2 object lifecycle and Worker authorization
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > /tmp/audit.png
          cp /tmp/audit.png /tmp/source.png

          wrangler r2 object put "$BUCKET/$KEY" --file /tmp/audit.png --content-type image/png --remote --force

          curl --fail --silent --show-error "$WORKER/media/$KEY" -o /tmp/fetched.png
          cmp --silent /tmp/source.png /tmp/fetched.png

          image_upload_code="$(curl --silent --show-error -o /tmp/image-unauth.json -w '%{http_code}'             -X POST -H 'content-type: image/png' --data-binary @/tmp/source.png             "$WORKER/image/upload?scope=audit&name=unauth.png")"
          test "$image_upload_code" = "401"

          image_delete_code="$(curl --silent --show-error -o /tmp/image-delete-unauth.json -w '%{http_code}'             -X DELETE "$WORKER/image/object?key=$KEY")"
          test "$image_delete_code" = "401"

          video_create_code="$(curl --silent --show-error -o /tmp/video-unauth.json -w '%{http_code}'             -X POST -H 'content-type: application/json'             -d '{"name":"audit.mp4","type":"video/mp4","size":1024}'             "$WORKER/upload/create")"
          test "$video_create_code" = "401"

          wrangler r2 object delete "$BUCKET/$KEY" --remote

          missing_code="$(curl --silent --show-error -o /tmp/missing.txt -w '%{http_code}' "$WORKER/media/$KEY")"
          test "$missing_code" = "404"

          echo "CDC R2 lifecycle, public retrieval, deletion and unauthorized Worker protections verified."
