name: Temporary CDC UX Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-ux-audit.yml'

permissions:
  contents: read

jobs:
  ux-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium
      - name: Verify donation feedback and immediate branding
        env:
          SITE_URL: https://owusuduahephraim1.github.io/child-development-centre/
        run: |
          cat > ux-audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          const errors=[];
          page.on('pageerror',e=>errors.push('pageerror: '+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});

          await page.route('**/rest/v1/rpc/create_donation_intent_v2', async route => {
            await route.fulfill({
              status:200,
              contentType:'application/json',
              body:JSON.stringify({ok:true,message:'Donation reference created: CDC-UX-TEST.',reference_code:'CDC-UX-TEST'})
            });
          });

          const response=await page.goto(process.env.SITE_URL,{waitUntil:'domcontentloaded',timeout:60000});
          if(!response?.ok()) throw new Error('Public site failed to load');

          const firstPaintBrand=await page.evaluate(()=>({
            hidden:document.getElementById('brandLogo')?.hidden,
            src:document.getElementById('brandLogo')?.getAttribute('src')||'',
            markHidden:document.getElementById('brandMark')?.hidden,
            favicon:document.getElementById('siteFavicon')?.getAttribute('href')||'',
            preload:[...document.querySelectorAll('link[rel="preload"][as="image"]')].map(x=>x.getAttribute('href'))
          }));
          if(firstPaintBrand.hidden!==false) throw new Error('Brand logo is hidden on initial HTML render');
          if(!firstPaintBrand.src.includes('cdc-media.edusentia-enterprise-neon.workers.dev')) throw new Error('Initial brand logo is not the official CDC logo');
          if(firstPaintBrand.markHidden!==true) throw new Error('Fallback CDC mark is visible before settings load');
          if(!firstPaintBrand.favicon.includes('cdc-media.edusentia-enterprise-neon.workers.dev')) throw new Error('Initial favicon is not the official CDC logo');
          if(!firstPaintBrand.preload.some(x=>x?.includes('66471ec8-6788-4837-b39c-eaa6b967a735.webp'))) throw new Error('CDC logo preload is missing');

          await page.waitForLoadState('networkidle');
          await page.locator('#donationForm input[name="name"]').fill('UX Test');
          await page.locator('#donationForm input[name="email"]').fill('ux-test@example.invalid');
          await page.locator('#donationForm input[name="amount"]').fill('10');
          await page.locator('#donationForm select[name="preferred_method"]').selectOption({label:'Contact Organisation'});
          await page.locator('#donationSubmitButton').click();

          const status=page.locator('#donationStatus');
          await status.waitFor({state:'visible'});
          await page.waitForFunction(()=>document.getElementById('donationStatus')?.textContent?.includes('CDC-UX-TEST'),null,{timeout:10000});
          if(!(await status.evaluate(el=>el.classList.contains('is-success')))) throw new Error('Donation confirmation is not styled as success');
          const successColor=await status.evaluate(el=>getComputedStyle(el).color);
          console.log('SUCCESS_COLOR',successColor);

          await page.waitForFunction(()=>document.getElementById('donationStatus')?.textContent==='',null,{timeout:7000});
          if((await status.textContent())!=='') throw new Error('Donation confirmation did not clear automatically');

          if(errors.length) throw new Error('Browser errors:\n'+errors.join('\n'));
          console.log('CDC UX audit passed without writing a donation record.');
          await browser.close();
          EOF
          node ux-audit.mjs
